[project]
name = "mostdsyandex"
version = "0.2.3"
description = "A small Windows bridge that shows Yandex Music tracks in Discord Rich Presence."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "MostDSYandex contributors" }
]
keywords = ["discord", "rich-presence", "yandex-music", "windows", "music"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "pypresence==4.6.1",
    "winsdk==1.0.0b10",
    "yandex-music==3.0.0",
    "pystray==0.19.5",
]

[project.urls]
Homepage = "https://github.com/FreskOff/MostDSYandex"
Issues = "https://github.com/FreskOff/MostDSYandex/issues"

[tool.ruff]
line-length = 100
target-version = "py312"
